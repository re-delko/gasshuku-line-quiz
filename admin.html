<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合宿アプリ 運営パネル</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="admin">

<div id="login" class="login">
  <h1>合宿アプリ 運営パネル</h1>
  <p class="sub">運営陣で共有しているパスコードを入れてください。</p>
  <input id="pass" type="password" class="input" placeholder="運営パスコード" autocomplete="current-password">
  <button class="btn primary" id="login-btn">入る</button>
  <p class="err" id="login-err"></p>
</div>

<div id="main" hidden>
  <header class="adm-hd">
    <b>運営パネル</b>
    <span class="sub" id="now-scene"></span>
    <a href="screen.html" target="_blank" class="sub">スクリーン画面を開く</a>
    <button class="btn small" id="logout">ログアウト</button>
  </header>
  <nav class="adm-tabs" id="adm-tabs"></nav>
  <main id="pane"></main>
</div>
<div id="toast"></div>

<script>
let code = sessionStorage.getItem('adm_code') || '';
let live = { scene: 'idle', payload: {} };
let tab = 'live';

const $pane = document.getElementById('pane');
const toast = (msg, bad) => { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); setTimeout(() => t.className = '', 2500); };
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, { code, ...args });
  if (error) { toast(error.message, true); throw error; }
  return data;
}

// ===== ログイン =====
async function login(c) {
  const { data, error } = await sb.rpc('admin_check', { code: c });
  if (error) { document.getElementById('login-err').textContent = `接続できません：${error.message}`; return; }
  if (!data) { document.getElementById('login-err').textContent = 'パスコードが違います'; sessionStorage.removeItem('adm_code'); return; }
  code = c; sessionStorage.setItem('adm_code', c);
  document.getElementById('login').hidden = true;
  document.getElementById('main').hidden = false;
  init();
}
document.getElementById('login-btn').onclick = () => login(document.getElementById('pass').value);
document.getElementById('pass').onkeydown = e => { if (e.key === 'Enter') login(e.target.value); };
document.getElementById('logout').onclick = () => { sessionStorage.removeItem('adm_code'); location.reload(); };
if (code) login(code);

// 台本の種類
const KINDS = [['idle', '待機'], ['quiz', 'クイズ'], ['buzz', '早押し'], ['bingo', 'ビンゴ'], ['ranking', '総合ランキング発表'], ['award', '表彰（次の1つ）'], ['reveal', '重大発表（次の1つ）']];
const KIND_NAME = Object.fromEntries(KINDS);

// ===== 編集する表の定義（タブ = 1つの表） =====
const TABLES = {
  settings: { label: '基本情報', single: true, note: 'アプリの名前は、参加者の画面の左上とスクリーンの待機画面に出ます。班と部屋は、公開にすると参加者が自分の呼び名をタップしたときに見えます（2日目に発表したいときは、それまで公開にしない）。', fields: [
    { k: 'title', label: 'アプリの名前' }, { k: 'show_profile', label: '班と部屋を参加者に公開する', type: 'checkbox' }] },
  members: { label: '名簿', note: '会社の情報を外に出さないため、名前は<b>ひらがなの下の名前かニックネーム</b>で入れます（例：れいや）。名字・漢字の氏名・社名は入れません。同じ呼び名の人がいたら「れいや2」のように分けます。参加者には、ここに入れた呼び名で申請してもらいます。',
    sort: (a, b) => a.sort - b.sort || a.name.localeCompare(b.name, 'ja'),
    bulk: { hint: '1行に1人、「呼び名,班,部屋」の形で貼り付けます（班と部屋は省略できます）。', example: 'れいや,A班,201\nみゆ,B班,202',
      parse: (c, i, n) => c[0] && { name: c[0], team: c[1] || '', room: c[2] || '', sort: n + i + 1 } },
    fields: [{ k: 'name', label: '呼び名（ひらがな・ニックネーム）' }, { k: 'team', label: '班' }, { k: 'room', label: '部屋' }, { k: 'sort', label: '並び順', type: 'number' }] },
  awards: { label: '表彰', secret: true, note: '経営陣が決めた部門と受賞者を入れます。受賞者も名簿と同じ呼び名で入れます。発表するまで参加者からは見えません。発表は「進行」タブから行います。',
    sort: (a, b) => a.sort - b.sort,
    bulk: { hint: '1行に1つ、「部門,受賞者,ひとこと」の形で貼り付けます。', example: 'MVP,みゆ,みんなを引っぱってくれた1年でした\n新人賞,しょうた,',
      parse: (c, i, n) => c[0] && { category: c[0], winner: c[1] || '', comment: c.slice(2).join('、'), sort: n + i + 1 } },
    fields: [{ k: 'category', label: '部門' }, { k: 'winner', label: '受賞者' }, { k: 'comment', label: '受賞理由・ひとこと', type: 'textarea' }, { k: 'sort', label: '発表順', type: 'number' }] },
  reveals: { label: '重大発表', secret: true, note: 'ここには<b>見出しだけ</b>を入れます（例：「新しい取り組みの発表」）。社外に出せない中身（取引先・金額・人事など）は入れず、スライドや口頭で伝えます。発表するまで参加者からは見えません。',
    sort: (a, b) => a.sort - b.sort,
    bulk: { hint: '1行に1つ、見出しを貼り付けます。', example: '新しい取り組みの発表\n来年の合宿の行き先',
      parse: (c, i, n) => c[0] && { title: c.join('、'), sort: n + i + 1 } },
    fields: [{ k: 'title', label: '発表の見出し' }, { k: 'body', label: 'ひとこと（任意。社外秘の中身は書かない）', type: 'textarea', rows: 3 }, { k: 'sort', label: '発表順', type: 'number' }] },
  quiz_questions: { label: 'クイズ', note: '選択肢は1行に1つ書きます。正解は上から数えた番号（1から）で入れます。問題づくりは Claude に「合宿クイズを10問、貼り付け形式で」と頼むと、そのまま貼れる形で作れます。',
    sort: (a, b) => a.order_no - b.order_no,
    bulk: { hint: '1行に1問、「問題,選択肢1,選択肢2,選択肢3,選択肢4,正解の番号」の形で貼り付けます（選択肢は2〜4個）。同じ番号の問題は上書きします。',
      example: '合宿の会場がある県は？,静岡県,神奈川県,山梨県,千葉県,1\n今年いちばん使ったAIは？,Claude,Copilot,ChatGPT,Gemini,2',
      parse: (c, i, n) => { const ans = Number(c[c.length - 1]); const ch = c.slice(1, -1);
        return c[0] && ch.length >= 2 && ans >= 1 && ans <= ch.length && { order_no: n + i + 1, question_text: c[0], choices: ch, correct_index: ans - 1 }; } },
    fields: [{ k: 'order_no', label: '問題番号', type: 'number' }, { k: 'question_text', label: '問題文', type: 'textarea' },
      { k: 'choices', label: '選択肢（1行に1つ）', type: 'lines' }, { k: 'correct_index', label: '正解の番号', type: 'number', offset: 1 }],
    blank: rows => ({ order_no: Math.max(0, ...rows.map(r => r.order_no)) + 1, choices: ['', '', '', ''], correct_index: 0 }) },
  program_steps: { label: '台本', note: '当日はこの順に「次へ」を押すだけで進みます。表彰・重大発表は、まだ発表していないものを発表順に1つずつ出します。「おすすめの台本」は「進行」タブから入れられます。',
    sort: (a, b) => a.sort - b.sort,
    fields: [{ k: 'sort', label: '順番', type: 'number' }, { k: 'kind', label: '種類', type: 'select', options: KINDS }, { k: 'label', label: '表示名（運営だけが見る）' },
      { k: 'done', label: '済み', type: 'checkbox' }],
    blank: rows => ({ sort: Math.max(0, ...rows.map(r => r.sort)) + 1, kind: 'quiz' }) },
};
const TAB_ORDER = [['live', '進行'], ['devices', '参加申請'], ...Object.entries(TABLES).map(([k, v]) => [k, v.label]), ['config', '設定']];

function init() {
  document.getElementById('adm-tabs').innerHTML = TAB_ORDER.map(([k, l]) => `<button data-t="${k}">${l}</button>`).join('');
  document.querySelectorAll('#adm-tabs button').forEach(b => b.onclick = () => setTab(b.dataset.t));
  call('live_view', { p_key: code }).then(l => { live = l; showScene(); setTab(tab); });
  // 入力中に画面が書き換わらないよう、自動で描き直すのは「進行」「参加申請」タブだけ
  const reload = debounce(async () => {
    try { live = await call('live_view', { p_key: code }); showScene(); } catch (e) { return; }
    if (tab === 'live') renderLive();
  }, 300);
  onPulse(topic => {
    if (topic === 'content' && tab === 'devices') renderDevices();
    if (topic !== 'content') reload();
  });
}
const SCENE = { idle: '待機中', ranking: '総合ランキング発表', award: '表彰', reveal: '重大発表', quiz: 'クイズ', buzz: '早押し', bingo: 'ビンゴ' };
function showScene() { document.getElementById('now-scene').textContent = `いまの場面：${SCENE[live.scene]}`; }

function setTab(t) {
  tab = t;
  document.querySelectorAll('#adm-tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'live') renderLive();
  else if (t === 'devices') renderDevices();
  else if (t === 'config') renderConfig();
  else renderTable(t);
}

// ===== 表の編集（どの表も同じ作り） =====
function fieldHtml(f, v) {
  if (f.type === 'select') return `<label>${f.label}<select data-k="${f.k}">${f.options.map(([o, l]) => `<option value="${o}" ${o === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
  if (f.type === 'checkbox') return `<label class="check"><input data-k="${f.k}" type="checkbox" ${v ? 'checked' : ''}>${f.label}</label>`;
  const val = f.type === 'lines' ? (v || []).join('\n') : f.offset ? (v ?? 0) + f.offset : (v ?? '');
  if (f.type === 'textarea' || f.type === 'lines') return `<label>${f.label}<textarea data-k="${f.k}" rows="${f.rows || (f.type === 'lines' ? 4 : 3)}">${esc(val)}</textarea></label>`;
  return `<label>${f.label}<input data-k="${f.k}" type="${f.type || 'text'}" value="${esc(val)}"></label>`;
}
function readRow(card, def) {
  const row = {};
  for (const f of def.fields) {
    const el = card.querySelector(`[data-k="${f.k}"]`);
    let v = el.value;
    if (f.type === 'checkbox') v = el.checked;
    else if (f.type === 'lines') v = v.split('\n').map(s => s.trim()).filter(Boolean);
    else if (f.type === 'number') v = v === '' ? 0 : Number(v) - (f.offset || 0);
    row[f.k] = v;
  }
  return row;
}

async function renderTable(t) {
  const def = TABLES[t];
  $pane.innerHTML = '<p class="sub">読み込み中…</p>';
  let rows = await rpc('admin_list', { tbl: t });
  if (def.sort) rows.sort(def.sort);
  const pk = t === 'quiz_questions' ? 'order_no' : 'id';
  const card = (r, isNew) => `<div class="ecard ${isNew ? 'new' : ''}" data-id="${isNew ? '' : esc(r[pk])}">
      ${def.fields.map(f => fieldHtml(f, r[f.k])).join('')}
      ${t === 'awards' || t === 'reveals' ? `<div class="sub">${r.revealed ? '発表済み' : '未発表'}</div>` : ''}
      <div class="row-btns"><button class="btn primary small" data-save>${isNew ? '追加する' : '保存'}</button>
      ${!isNew && !def.single ? '<button class="btn small danger" data-del>削除</button>' : ''}</div></div>`;
  $pane.innerHTML = `<h2>${def.label}${def.secret ? ' <span class="secret">発表まで非公開</span>' : ''}</h2><p class="sub">${def.note}</p>
    ${t === 'members' ? `<p class="sub">${rows.length} 人。参加者の承認は「参加申請」タブで行います。</p>` : ''}
    ${def.bulk ? `<details class="ecard" ${rows.length ? '' : 'open'}><summary><b>まとめて貼り付けて追加する</b></summary><p class="sub">${def.bulk.hint}区切りは「,」「、」タブのどれでも構いません。</p>
      <textarea id="bulk" rows="7" placeholder="${esc(def.bulk.example)}"></textarea><button class="btn primary small" id="bulk-add">まとめて追加する</button></details>` : ''}
    ${def.single ? '' : card(def.blank ? def.blank(rows) : {}, true)}
    ${rows.map(r => card(r, false)).join('')}`;

  $pane.querySelectorAll('.ecard[data-id]').forEach(el => {
    el.querySelector('[data-save]')?.addEventListener('click', async () => {
      const row = readRow(el, def);
      if (el.dataset.id && pk === 'id') row.id = el.dataset.id;
      if (def.single) row.id = 1;
      if (t === 'quiz_questions' && el.dataset.id && String(row.order_no) !== el.dataset.id) await rpc('admin_delete', { tbl: t, row_id: el.dataset.id });
      await rpc('admin_save', { tbl: t, row_data: row });
      toast('保存しました'); renderTable(t);
    });
    el.querySelector('[data-del]')?.addEventListener('click', async () => {
      if (!confirm('削除します。よろしいですか？')) return;
      await rpc('admin_delete', { tbl: t, row_id: el.dataset.id });
      toast('削除しました'); renderTable(t);
    });
  });
  document.getElementById('bulk-add')?.addEventListener('click', async () => {
    const lines = document.getElementById('bulk').value.split('\n').map(s => s.trim()).filter(Boolean);
    const base = t === 'quiz_questions' ? Math.max(0, ...rows.map(r => r.order_no)) : rows.length;
    const parsed = lines.map((line, i) => def.bulk.parse(line.split(/[,，、\t]/).map(x => x.trim()), i, base));
    const bad = parsed.map((r, i) => r ? 0 : i + 1).filter(Boolean);
    if (bad.length) return toast(`${bad.join('・')}行目の形が違います`, true);
    for (const r of parsed) await rpc('admin_save', { tbl: t, row_data: r });
    toast(`${parsed.length}件を追加しました`); renderTable(t);
  });
}

// ===== 参加申請 =====
async function renderDevices() {
  const [devs, members] = await Promise.all([rpc('admin_devices', {}), rpc('admin_list', { tbl: 'members' })]);
  members.sort((a, b) => a.sort - b.sort || a.name.localeCompare(b.name, 'ja'));
  const pending = devs.filter(d => d.status === 'pending'), approved = devs.filter(d => d.status === 'approved');
  const joined = new Set(approved.map(d => d.member_id));
  const notYet = members.filter(m => !joined.has(m.id));
  const opts = sel => `<option value="">名簿から選ぶ</option>` + members.map(m => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
  $pane.innerHTML = `<h2>参加申請</h2>
    <p class="sub">参加者がアプリで名前を入れると、ここに申請が届きます。<b>社員本人かどうかを確かめてから</b>承認してください。承認した端末だけが、合宿の案内や名簿を見られます。</p>
    <section class="ecard"><h3>承認待ち（${pending.length}件）</h3>
      ${pending.length ? `<p class="sub">名簿の名前と一致したものは、名簿の欄が埋まっています。</p>
        <button class="btn primary small" id="approve-matched" ${pending.some(d => d.member_id) ? '' : 'disabled'}>名簿と一致したものをまとめて承認</button>` : '<p class="sub">ありません</p>'}
      ${pending.map(d => `<div class="present" data-dev="${d.id}">
        <span>入力：<b>${esc(d.typed_name)}</b><br><span class="sub">LINE の名前：${esc(d.line_name) || '（なし）'}　${new Date(d.created_at).toLocaleString('ja-JP')}</span></span>
        <span class="row-btns"><select data-member>${opts(d.member_id)}</select>
        <button class="btn primary small" data-approve>承認</button><button class="btn small danger" data-remove>却下</button></span></div>`).join('')}
    </section>
    <section class="ecard"><h3>承認済み（${joined.size} / ${members.length} 人）</h3>
      ${approved.map(d => `<div class="present" data-dev="${d.id}"><span>${esc(d.member_name)} <span class="sub">（LINE：${esc(d.line_name) || 'なし'}）</span></span>
        <button class="btn small danger" data-remove>承認を取り消す</button></div>`).join('') || '<p class="sub">まだいません</p>'}
      ${notYet.length ? `<p class="sub">まだ参加していない人：${notYet.map(m => esc(m.name)).join('、')}</p>` : ''}
    </section>`;
  document.getElementById('approve-matched')?.addEventListener('click', async () => {
    const n = await rpc('admin_approve_matched', {}); toast(`${n}件を承認しました`); renderDevices();
  });
  $pane.querySelectorAll('[data-dev]').forEach(el => {
    el.querySelector('[data-approve]')?.addEventListener('click', async () => {
      const mid = el.querySelector('[data-member]').value;
      if (!mid) return toast('名簿の誰かを選んでください', true);
      await rpc('admin_approve', { p_device_id: el.dataset.dev, p_member_id: mid }); toast('承認しました'); renderDevices();
    });
    el.querySelector('[data-remove]')?.addEventListener('click', async () => {
      if (!confirm('この端末を外します。その端末では合宿の案内が見られなくなります。')) return;
      await rpc('admin_remove_device', { p_device_id: el.dataset.dev }); renderDevices();
    });
  });
}

// ===== 進行 =====
// 場面が変わったときだけ全体を描き直し、同じ場面の間は「いまの様子」だけを書き換える（入力中の文字を消さないため）
let renderedScene = null;
async function renderLive() {
  if (renderedScene === live.scene && document.getElementById('now-box')) return refreshStatus();
  renderedScene = live.scene;
  const p = live.payload || {};
  const [awards, reveals, qs, steps] = await Promise.all([
    rpc('admin_list', { tbl: 'awards' }), rpc('admin_list', { tbl: 'reveals' }), rpc('admin_list', { tbl: 'quiz_questions' }), rpc('admin_list', { tbl: 'program_steps' }),
  ]);
  awards.sort((a, b) => a.sort - b.sort); reveals.sort((a, b) => a.sort - b.sort); steps.sort((a, b) => a.sort - b.sort);
  const nq = qs.length;
  const next = steps.find(x => !x.done);

  $pane.innerHTML = `
    <section class="ecard program"><h3>台本</h3>
      ${steps.length ? `<button class="next-btn" id="next-step" ${next ? '' : 'disabled'}>${next ? `次へ：${esc(next.label || KIND_NAME[next.kind])}` : '台本はすべて終わりました'}</button>
        <ol class="steps">${steps.map(x => `<li class="${x.done ? 'done' : x === next ? 'next' : ''}"><span>${esc(x.label || KIND_NAME[x.kind])}</span><span class="sub">${KIND_NAME[x.kind]}</span></li>`).join('')}</ol>
        <div class="row-btns"><button class="btn small" id="skip-step" ${next ? '' : 'disabled'}>この手順を飛ばす</button><button class="btn small" id="reset-steps">台本を最初に戻す</button></div>`
      : `<p class="sub">台本を入れておくと、当日は「次へ」を押すだけで進みます。</p><button class="btn primary" id="seed-steps">おすすめの台本を入れる</button>`}
    </section>

    <section class="ecard now-box"><div class="label">いまの場面</div><div class="big">${SCENE[live.scene]}</div>
      <div id="now-box"></div>
      <button class="btn" data-act="idle">待機に戻す（参加者の画面は「まもなく始まります」になります）</button></section>

    <section class="ecard"><h3>表彰</h3><p class="sub">押すと全員の画面に「受賞者は……」と5秒溜めてから名前が出ます。中身は「表彰」タブで入れます。</p>
      ${awards.map(a => `<div class="present"><span>${a.revealed ? '✅' : '・'} ${esc(a.category)}（${esc(a.winner) || '受賞者未入力'}）</span><button class="btn primary small" data-present="award" data-id="${a.id}">発表</button></div>`).join('') || '<p class="sub">まだ登録がありません</p>'}</section>

    <section class="ecard"><h3>重大発表</h3><p class="sub">押すと全員の画面が暗転し、5秒のカウントダウンのあとに出ます。</p>
      ${reveals.map(v => `<div class="present"><span>${v.revealed ? '✅' : '・'} ${esc(v.title)}</span><button class="btn primary small" data-present="reveal" data-id="${v.id}">発表</button></div>`).join('') || '<p class="sub">まだ登録がありません</p>'}</section>

    <section class="ecard"><h3>クイズ（全${nq}問）</h3><p class="sub">全員が答えると正解発表（答えの分布と上位5人）を7秒見せ、自動で次の問題へ進みます。早く正解するほど点が高くなります（最大1000点）。答えない人がいて止まったら「次へ進める」を押します。</p>
      <div class="row-btns"><button class="btn primary" data-act="quiz-start">最初から始める</button>
      <button class="btn" data-act="quiz-next" ${live.scene === 'quiz' && p.phase !== 'finished' ? '' : 'disabled'}>次へ進める</button>
      <button class="btn" data-act="quiz-finish" ${live.scene === 'quiz' ? '' : 'disabled'}>結果を出す</button></div></section>

    <section class="ecard"><h3>早押し</h3>
      <label>問題（任意。口頭で出すなら空でよい）<input id="b-q"></label>
      <div class="row-btns"><button class="btn primary" data-act="buzz-new">新しい問題で受付開始</button>
      <button class="btn" data-act="buzz-close" ${live.scene === 'buzz' && p.open ? '' : 'disabled'}>締め切る</button></div></section>

    <section class="ecard"><h3>総合ランキング</h3><p class="sub">クイズ・早押し・ビンゴの点の合計です。押すと全員の画面で5秒溜めてから表彰台が出ます。待機中の画面にも上位5人が出ています。</p>
      <div class="row-btns"><button class="btn primary" data-act="ranking">総合ランキングを発表</button></div></section>

    <section class="ecard"><h3>ビンゴ</h3>
      <div class="row-btns"><button class="btn primary" data-act="bingo-start">新しいカードで始める</button>
      <button class="btn primary" data-act="bingo-draw" ${live.scene === 'bingo' ? '' : 'disabled'}>番号を引く</button></div></section>`;

  $pane.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, live.payload || {}, nq));
  document.getElementById('seed-steps')?.addEventListener('click', async () => {
    const plan = [['idle', '開場・参加の受付'], ['quiz', 'クイズ大会'], ['buzz', '早押し 第1問'], ['buzz', '早押し 第2問'], ['buzz', '早押し 第3問'], ['bingo', 'ビンゴ'],
      ['ranking', '総合ランキング発表'], ...awards.map(a => ['award', `表彰：${a.category}`]), ...reveals.map(v => ['reveal', `重大発表：${v.title}`]), ['idle', 'おわり']];
    for (const [i, [kind, label]] of plan.entries()) await rpc('admin_save', { tbl: 'program_steps', row_data: { sort: i + 1, kind, label } });
    toast('おすすめの台本を入れました'); renderedScene = null; renderLive();
  });
  document.getElementById('next-step')?.addEventListener('click', async e => {
    e.target.disabled = true;
    try { await runStep(next, awards, reveals, nq); await rpc('admin_save', { tbl: 'program_steps', row_data: { id: next.id, done: true } }); }
    finally { renderedScene = null; renderLive(); }
  });
  document.getElementById('skip-step')?.addEventListener('click', async () => {
    await rpc('admin_save', { tbl: 'program_steps', row_data: { id: next.id, done: true } }); renderedScene = null; renderLive();
  });
  document.getElementById('reset-steps')?.addEventListener('click', async () => {
    if (!confirm('台本の「済み」をすべて外して、最初からにします。よろしいですか？')) return;
    await rpc('admin_reset', { what: 'program' }); renderedScene = null; renderLive();
  });
  $pane.querySelectorAll('[data-present]').forEach(b => b.onclick = async () => {
    if (!confirm('全員の画面に発表します。よろしいですか？')) return;
    await rpc('admin_present', { p_kind: b.dataset.present, p_id: b.dataset.id, p_delay_sec: 5 });
    renderedScene = null;
  });
  refreshStatus();
}

// 場面ごとの「いまの様子」
function refreshStatus() {
  const p = live.payload || {}, el = document.getElementById('now-box');
  if (!el) return;
  let status = '';
  if (live.scene === 'quiz') {
    status = p.phase === 'finished' ? '全問終わりました。参加者とスクリーンに表彰台が出ています。'
      : p.phase === 'reveal' ? `Q${p.q} / ${p.total}　正解発表中（まもなく次の問題へ）`
      : `Q${p.q} / ${p.total}　出題中　回答 ${live.quiz?.answered ?? 0} / ${live.joined} 人`;
  } else if (live.scene === 'buzz') {
    status = `第${p.round}問（${p.open ? '受付中' : '締め切り'}）` + ((live.buzz || []).length
      ? `<div class="buzz-list">${live.buzz.map((b, i) => `<div><span>${i + 1}番 ${esc(b.name)}</span><button class="btn primary small" data-correct="${b.id}">正解 +300</button></div>`).join('')}</div>`
      : '　まだ誰も押していません');
  } else if (live.scene === 'bingo') {
    status = `出た番号（${(p.numbers || []).length}個）：${(p.numbers || []).join('、') || 'まだありません'}<br>リーチ ${live.reach ?? 0}人　ビンゴの人：${(live.bingo_winners || []).map(esc).join('、') || 'まだいません'}`;
  }
  else if (live.scene === 'award') status = `${esc(p.category)}${p.winner !== undefined ? '：' + esc(p.winner) : '（発表の溜め中）'}`;
  else if (live.scene === 'reveal') status = p.title !== undefined ? esc(p.title) : '（発表の溜め中）';
  el.innerHTML = `<div>${status}</div><div class="sub">参加者 ${live.joined} 人（承認済み）</div>`;
  el.querySelectorAll('[data-correct]').forEach(b => b.onclick = async () => {
    await rpc('admin_buzz_correct', { p_member_id: b.dataset.correct, p_points: 300 });
    b.disabled = true; b.textContent = '+300 付けました'; toast('300点を付けました');
  });
  // 場面に応じてボタンの押せる・押せないを切り替える
  const dis = (act, off) => { const b = $pane.querySelector(`[data-act="${act}"]`); if (b) b.disabled = off; };
  dis('quiz-next', !(live.scene === 'quiz' && p.phase !== 'finished'));
  dis('quiz-finish', live.scene !== 'quiz');
  dis('buzz-close', !(live.scene === 'buzz' && p.open));
  dis('bingo-draw', live.scene !== 'bingo');
}

// 台本の1手順を実行する
async function runStep(step, awards, reveals, nq) {
  const p = live.payload || {};
  switch (step.kind) {
    case 'idle': return rpc('admin_set_live', { p_scene: 'idle', p_payload: {} });
    case 'quiz': if (!nq) throw toast('クイズの問題がありません', true); return rpc('admin_quiz', { p_action: 'start' });
    case 'buzz': return rpc('admin_set_live', { p_scene: 'buzz', p_payload: { round: (live.scene === 'buzz' ? p.round : 0) + 1, open: true, question: '' } });
    case 'bingo': return rpc('admin_bingo', { p_action: 'start' });
    case 'ranking': return rpc('admin_show_ranking', {});
    case 'award': case 'reveal': {
      const item = (step.kind === 'award' ? awards : reveals).find(x => !x.revealed);
      if (!item) throw toast(step.kind === 'award' ? 'まだ発表していない表彰がありません' : 'まだ発表していない重大発表がありません', true);
      return rpc('admin_present', { p_kind: step.kind, p_id: item.id, p_delay_sec: 5 });
    }
  }
}

async function act(a, p, nq) {
  const set = (scene, payload) => rpc('admin_set_live', { p_scene: scene, p_payload: payload });
  switch (a) {
    case 'idle': return set('idle', {});
    case 'quiz-start':
      if (!nq) return toast('クイズの問題がありません', true);
      if (!confirm('これまでの回答を消して、1問目から始めます。よろしいですか？')) return;
      return rpc('admin_quiz', { p_action: 'start' });
    case 'quiz-next': return rpc('admin_quiz', { p_action: 'next' });
    case 'quiz-finish': return rpc('admin_quiz', { p_action: 'finish' });
    case 'ranking': return rpc('admin_show_ranking', {});
    case 'buzz-new':
      return set('buzz', { round: (live.scene === 'buzz' ? p.round : 0) + 1, open: true, question: document.getElementById('b-q').value });
    case 'buzz-close': return set('buzz', { ...p, open: false });
    case 'bingo-start':
      if (!confirm('新しいカードでビンゴを始めます。よろしいですか？')) return;
      return rpc('admin_bingo', { p_action: 'start' });
    case 'bingo-draw': return rpc('admin_bingo', { p_action: 'draw' });
  }
}

// ===== 設定 =====
function renderConfig() {
  $pane.innerHTML = `<h2>設定</h2>
    <section class="ecard"><h3>参加者に配るリンク</h3><p><a href="${LIFF_URL}" target="_blank">${LIFF_URL}</a></p>
      <p class="sub">LINE公式アカウントのリッチメニューやメッセージにこのリンクを置きます。</p></section>
    <section class="ecard"><h3>運営パスコードを変える</h3><p class="sub">変えたら、新しいパスコードを運営陣に共有してください。</p>
      <input id="newpass" type="password" class="input" placeholder="新しいパスコード（12文字以上）"><button class="btn primary" id="chg">変える</button></section>
    <section class="ecard"><h3>リハーサルのあとに記録を消す</h3><p class="sub">本番の前に、リハーサルで残った記録を消します。中身（名簿・表彰・クイズの問題など）は消えません。</p>
      <div class="row-btns"><button class="btn danger" data-reset="quiz">クイズの回答</button><button class="btn danger" data-reset="buzz">早押しの記録</button><button class="btn danger" data-reset="score">総合点</button><button class="btn danger" data-reset="program">台本の「済み」</button>
      <button class="btn danger" data-reset="reactions">リアクション・ビンゴ</button><button class="btn danger" data-reset="present">表彰・重大発表の「発表済み」</button></div></section>
    <section class="ecard"><h3>合宿が終わったら：社員の情報と伏せていた中身をすべて消す</h3>
      <p class="sub">名簿・参加者の端末・表彰・重大発表・クイズの回答などを消します。クイズの問題とアプリの名前は残ります。元に戻せません。</p>
      <input id="wipe-text" class="input" placeholder="確認のため「すべて消す」と入力"><button class="btn danger" id="wipe">すべて消す</button></section>`;
  document.getElementById('chg').onclick = async () => {
    const nc = document.getElementById('newpass').value;
    await rpc('admin_change_passcode', { new_code: nc });
    code = nc; sessionStorage.setItem('adm_code', nc); toast('パスコードを変えました');
  };
  document.getElementById('wipe').onclick = async () => {
    await rpc('admin_wipe_all', { confirm_text: document.getElementById('wipe-text').value });
    toast('すべて消しました');
  };
  $pane.querySelectorAll('[data-reset]').forEach(b => b.onclick = async () => {
    if (!confirm(`「${b.textContent}」を消します。元に戻せません。よろしいですか？`)) return;
    await rpc('admin_reset', { what: b.dataset.reset }); toast('消しました');
  });
}
</script>
