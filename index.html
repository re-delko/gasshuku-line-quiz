<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17182B">
<title>合宿あそび</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="phone">
<div class="lobby-bg"></div>
<header class="topbar">
  <div class="brand" id="brand">合宿<b>あそび</b></div>
  <button class="me-chip" id="me-chip" hidden></button>
</header>
<main id="view"><div class="screen-fill"><div class="dots"><span></span><span></span><span></span></div></div></main>

<script>
// 参加者の画面。タブは持たず、運営が切り替えた「いまのゲーム」だけを1画面で見せる
const DEV = new URLSearchParams(location.search).has('dev'); // PC での動作確認用（LINE を通さずに開く）
const KEY = deviceKey();
let me = null;
let live = { scene: 'idle', payload: {} };
let tick = null;
let line = { id: '', name: '' };
let lastFx = '';           // 紙吹雪などの演出を同じ場面で何度も出さないための印

const $view = document.getElementById('view');
const fill = html => { $view.innerHTML = `<div class="screen-fill">${html}</div>`; };
const fail = e => fill(`<div class="headline">うまく読み込めませんでした</div><div class="muted">LINE から開き直してください<br><small>${esc(e.message)}</small></div>`);
const buzzVibe = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

async function main() {
  try {
    if (!DEV) {
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      const pf = await liff.getProfile();
      line = { id: pf.userId, name: pf.displayName };
    }
    const st = await call('my_status', { p_key: KEY });
    if (st === 'approved') await start();
    else if (st === 'pending') renderPending();
    else renderJoin();
  } catch (e) { fail(e); }
}

// ===== はじめて開いたとき：呼び名を入れて参加を申請する =====
function renderJoin() {
  fill(`<div class="lobby-emoji">🎮</div>
    <div class="join-card">
      <div class="kicker" style="color:var(--accent)">ようこそ</div>
      <h2>あなたの呼び名を入れてください</h2>
      <p class="sub">運営から案内された呼び名（ひらがなの下の名前かニックネーム）を入れます。運営が確認すると、ゲームに参加できます。</p>
      <input id="nm" class="input" placeholder="例：れいや" autocomplete="off">
      <button class="big-btn" id="join">参加する</button>
    </div>`);
  document.getElementById('join').onclick = async () => {
    const name = document.getElementById('nm').value.trim();
    if (!name) return;
    try { await call('join_request', { p_key: KEY, p_name: name, p_line_user_id: line.id, p_line_name: line.name }); renderPending(); }
    catch (e) { alert(e.message); }
  };
}

let pendingTimer = null;
function renderPending() {
  fill(`<div class="dots"><span></span><span></span><span></span></div>
    <div class="headline">運営の確認を<br>待っています</div>
    <div class="muted">確認が済むと、この画面が自動で切り替わります</div>
    <button class="ghost-btn" id="redo">呼び名を入れ直す</button>`);
  document.getElementById('redo').onclick = () => { clearInterval(pendingTimer); renderJoin(); };
  clearInterval(pendingTimer);
  pendingTimer = setInterval(async () => {
    try { if (await call('my_status', { p_key: KEY }) === 'approved') { clearInterval(pendingTimer); start(); } } catch (e) {}
  }, 4000);
}

// ===== 参加中 =====
async function start() {
  try { await loadAll(); } catch (e) { return fail(e); }
  const chip = document.getElementById('me-chip');
  chip.hidden = false;
  chip.innerHTML = `<span class="av">${esc((me?.name || '?').slice(0, 1))}</span>${esc(me?.name || '')}`;
  chip.onclick = openProfile;
  render();
  const reloadAll = debounce(() => loadAll().then(render).catch(() => {}), 300);
  const reloadLive = debounce(refreshLive, 150);
  onPulse((topic, info) => {
    if (topic === 'content' || topic === 'poll') reloadAll();
    else if (topic === 'react') { if (info.kind === 'bingo' || info.kind === 'reach') reloadLive(); }
    else reloadLive();
  });
}

async function loadAll() {
  let v;
  try { v = await call('view_all', { p_key: KEY }); }
  catch (e) { if (e.message.includes('承認')) location.reload(); throw e; } // 承認を取り消されたとき
  me = v.me; setLive(v.live);
  if (v.title) document.getElementById('brand').textContent = v.title;
}

async function refreshLive() {
  try { const next = await call('live_view', { p_key: KEY }); if (setLive(next)) render(); } catch (e) {}
}
// 変わったときだけ true を返す
function setLive(next) {
  syncClock(next.server_now);
  const same = JSON.stringify({ ...live, server_now: 0 }) === JSON.stringify({ ...next, server_now: 0 });
  live = next;
  return !same;
}

// 自分の呼び名をタップすると、班と部屋（運営が公開していれば）が見える
function openProfile() {
  const back = document.createElement('div');
  back.className = 'sheet-back';
  const hasTeam = me && (me.team || me.room);
  back.innerHTML = `<div class="sheet"><h3>${esc(me?.name)} さん</h3>
    ${me && me.team !== null && me.team !== undefined
      ? `<div class="row"><span>班</span><b>${esc(me.team) || '未定'}</b></div><div class="row"><span>部屋</span><b>${esc(me.room) || '未定'}</b></div>`
      : '<p class="sub">班と部屋は、運営が発表するまでお楽しみです。</p>'}
    <button class="btn" style="width:100%;margin-top:16px" id="close">とじる</button></div>`;
  back.onclick = e => { if (e.target === back || e.target.id === 'close') back.remove(); };
  document.body.appendChild(back);
}

// ===== 場面ごとの画面 =====
function render() {
  clearInterval(tick); tick = null;
  const p = live.payload || {};
  switch (live.scene) {
    case 'quiz': return renderQuiz(p, live.quiz || {});
    case 'buzz': return renderBuzz(p, live.buzz || []);
    case 'bingo': return renderBingo(p);
    case 'award': case 'reveal': return renderStage(p);
    default: return renderLobby();
  }
}

function renderLobby() {
  const names = live.names || [];
  fill(`<div class="lobby-emoji">🎉</div>
    <div class="kicker">STAND BY</div>
    <div class="headline">まもなく<br>ゲームが始まります</div>
    <div><div class="count-big">${live.joined ?? 0}</div><div class="muted">人が参加中</div></div>
    <div class="names">${names.slice(0, 40).map(n => `<span class="${n === me?.name ? 'me' : ''}">${esc(n)}</span>`).join('')}</div>
    <div class="muted">始まると、この画面が自動で切り替わります</div>`);
}

// クイズ：スマホは色と形のボタンだけ。問題はスクリーンにも大きく出る
function renderQuiz(p, q) {
  const head = `<div class="q-head"><span class="pill">Q${p.q} / ${p.total}</span><span class="pill">クイズ</span></div>`;
  if (p.phase === 'finished') {
    const rank = q.ranking || [];
    const mine = rank.findIndex(r => r.id === me?.id);
    $view.innerHTML = `<div class="screen-fill"><div class="kicker">RESULT</div><div class="headline">結果発表</div>
      ${podiumHtml(rank)}
      ${mine >= 0 ? `<div class="rank-card">あなたは ${mine + 1}位　${rank[mine].score.toLocaleString()}点（${rank[mine].correct}問正解）</div>` : ''}</div>`;
    if (mine === 0) fx('quiz-win', () => confetti());
    return;
  }
  if (p.phase === 'reveal') {
    const rank = q.ranking || [];
    const mine = rank.findIndex(r => r.id === me?.id);
    const answered = q.my_choice !== null && q.my_choice !== undefined;
    const ok = answered && q.my_choice === q.correct_index;
    const sh = SHAPES[q.correct_index] || SHAPES[0];
    $view.innerHTML = `<div class="result ${!answered ? 'none' : ok ? 'ok' : 'ng'}">
      <div class="mark">${!answered ? '⏱' : ok ? '⭕' : '❌'}</div>
      <div class="word">${!answered ? '時間切れ' : ok ? '正解！' : 'ざんねん'}</div>
      ${ok ? `<div class="pts">+<span id="pts">0</span></div>` : ''}
      <div class="muted" style="color:#fff">正解は <b>${sh.name}</b>「${esc((q.choices || [])[q.correct_index])}」</div>
      ${mine >= 0 ? `<div class="rank-card">いま ${mine + 1}位 / ${rank.length}人　${rank[mine].score.toLocaleString()}点</div>` : ''}
      <div class="muted" style="color:#fff;margin-top:8px">まもなく次の問題へ</div></div>`;
    if (ok) countUp(document.getElementById('pts'), q.my_points || 0);
    fx(`reveal-${p.q}`, () => buzzVibe(ok ? [60, 40, 60] : 200));
    // 正解発表の時間が過ぎたら読み直す（サーバーが次の問題へ進める）
    if (p.next_at) tick = setTimeout(refreshLive, Math.max(500, secondsUntil(p.next_at) * 1000 + 300));
    return;
  }
  // 出題中
  if (q.my_choice === null || q.my_choice === undefined) {
    $view.innerHTML = head + `<p class="q-text">${esc(q.question_text)}</p>
      <div class="answers">${(q.choices || []).map((c, i) => { const s = SHAPES[i]; return `
        <button class="ans" data-i="${i}" style="background:${s.color}" aria-label="${s.name} ${esc(c)}">${s.svg}<span>${esc(c)}</span></button>`; }).join('')}</div>`;
    $view.querySelectorAll('.ans').forEach(b => b.addEventListener('click', async () => {
      $view.querySelectorAll('.ans').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim'); });
      buzzVibe(30);
      try { await call('quiz_answer', { p_key: KEY, p_q: p.q, p_choice: Number(b.dataset.i) }); } catch (e) { alert(e.message); }
      refreshLive();
    }));
    return;
  }
  const s = SHAPES[q.my_choice];
  const pct = live.joined ? Math.round(q.answered / live.joined * 100) : 0;
  $view.innerHTML = head + `<div class="answered-box" style="background:${s.color}">
    ${s.svg}<div class="headline">回答しました</div>
    <div class="ring" style="--p:${pct}"><div>${q.answered}/${live.joined}</div></div>
    <div class="muted" style="color:#fff">全員がそろうと正解発表です</div></div>`;
}

// 早押し
function renderBuzz(p, order) {
  const myRank = order.findIndex(b => b.id === me?.id);
  const list = `<ol class="order">${order.slice(0, 5).map((b, i) => `<li class="${b.id === me?.id ? 'me' : ''}"><b>${i + 1}</b>${esc(b.name)}</li>`).join('')}</ol>`;
  if (myRank >= 0) {
    fill(`<div class="kicker">HAYAOSHI</div><div class="buzz-done">${myRank + 1}番</div><div class="headline">${myRank === 0 ? '一番乗り！' : '押しました！'}</div>${list}`);
    if (myRank === 0) fx(`buzz-${p.round}`, () => confetti(50));
    return;
  }
  if (!p.open) { fill(`<div class="kicker">HAYAOSHI</div><div class="headline">受付終了</div>${list}`); return; }
  $view.innerHTML = `<div class="q-head"><span class="pill">早押し　第${p.round}問</span></div>
    ${p.question ? `<p class="q-text">${esc(p.question)}</p>` : ''}
    <div class="buzz-wrap"><button class="buzz" id="buzz">押す！</button></div>`;
  document.getElementById('buzz').addEventListener('click', async e => {
    e.target.disabled = true; buzzVibe(80);
    try { await call('buzz_press', { p_key: KEY }); } catch (err) { alert(err.message); }
    refreshLive();
  });
}

// ビンゴ（カードは自分の名簿 id と回ごとの番号から決まり、出た番号は自動で開く）
let reachSent = '', bingoSent = '';
function renderBingo(p) {
  const drawn = p.numbers || [];
  const grid = bingoCard(me?.id || 'x', p.seed);
  const lines = bingoLines(grid, drawn);
  const last = drawn[drawn.length - 1];
  // リーチ：あと1つで1列そろうマスがあるか
  const isReach = !lines && grid.flat().some(n => n !== 0 && !drawn.includes(n) && bingoLines(grid, [...drawn, n]) > 0);
  const done = (live.bingo_winners || []).includes(me?.name);
  $view.innerHTML = `<div class="q-head"><span class="pill">ビンゴ　${drawn.length}個目</span><span class="pill">リーチ ${live.reach ?? 0}人</span></div>
    ${last ? `<div class="ball" key="${last}">${last}</div>` : '<div class="muted center">番号が出るのを待っています</div>'}
    <div class="center">${isReach ? '<span class="reach">リーチ！</span>' : ''}</div>
    <div class="bingo">${'BINGO'.split('').map(ch => `<div class="bh">${ch}</div>`).join('')}
      ${grid.flat().map(n => `<div class="bc ${n === 0 ? 'free' : drawn.includes(n) ? 'hit' : ''} ${n === last ? 'last' : ''}">${n === 0 ? 'FREE' : n}</div>`).join('')}</div>
    ${lines ? `<button class="bingo-btn" id="bingo" ${done ? 'disabled' : ''}>${done ? '運営に届きました' : 'BINGO！'}</button>` : ''}`;
  // リーチになったら運営とスクリーンに1回だけ知らせる
  if (isReach && reachSent !== String(p.seed)) { reachSent = String(p.seed); call('react', { p_key: KEY, p_kind: 'reach' }).catch(() => {}); buzzVibe(100); }
  document.getElementById('bingo')?.addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = '運営に届きました';
    if (bingoSent !== String(p.seed)) { bingoSent = String(p.seed); confetti(); await call('react', { p_key: KEY, p_kind: 'bingo' }).catch(err => alert(err.message)); }
  });
}

// 表彰・重大発表（受賞者と中身は、発表の時刻までサーバーから届かない）
function renderStage(p) {
  const isAward = live.scene === 'award';
  const hasContent = isAward ? p.winner !== undefined : p.title !== undefined;
  const draw = () => {
    const left = secondsUntil(p.show_at);
    if (left > 0 || !hasContent) {
      $view.innerHTML = `<div class="stage"><div class="kicker">${isAward ? 'AWARD' : 'ANNOUNCEMENT'}</div>
        ${isAward ? `<div class="stage-cat">${esc(p.category)}</div><div class="drum">受賞者は…… ドゥルルルル</div>` : '<div class="drum">重大発表があります</div>'}
        <div class="count">${left || '…'}</div></div>`;
      if (left === 0) { clearInterval(tick); tick = null; setTimeout(refreshLive, 300); }
    } else {
      clearInterval(tick); tick = null;
      $view.innerHTML = `<div class="stage"><div class="kicker">${isAward ? 'AWARD' : 'ANNOUNCEMENT'}</div>
        ${isAward ? `<div class="stage-cat">${esc(p.category)}</div><div class="winner">${esc(p.winner)}</div>` : `<div class="winner">${esc(p.title)}</div>`}
        <div class="stage-body">${escBr(isAward ? p.comment : p.body)}</div>
        <div class="reacts">${REACTIONS.map(r => `<button class="react" data-k="${r.kind}">${r.emoji}</button>`).join('')}</div></div>`;
      fx(`stage-${p.id}-${p.show_at}`, () => { confetti(); buzzVibe([80, 50, 80]); });
      $view.querySelectorAll('.react').forEach(b => b.addEventListener('click', () => {
        call('react', { p_key: KEY, p_kind: b.dataset.k }).catch(() => {});
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      }));
    }
  };
  draw(); if (secondsUntil(p.show_at) > 0) tick = setInterval(draw, 250);
}

// 演出を同じ場面で1回だけ出す
function fx(id, f) { if (lastFx !== id) { lastFx = id; f(); } }

main();
</script>
</body>
</html>
